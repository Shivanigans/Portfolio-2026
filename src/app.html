<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- National Park and Paper Mono live in static/fonts (set up in app.css).
		     The two used on every page start loading straight away. -->
		<link rel="preload" href="/fonts/PaperMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/NationalPark-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Bellefair, for the quote cards in one project, from Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-96.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<meta property="og:title" content="shivanigans" />
		<meta property="og:description" content="Shivani’s corner on the internet" />
		<meta property="og:url" content="https://shivanigans.fyi/" />
		<meta property="og:type" content="website" />
		<!-- Drawn at twice the 1200x630 the sharing cards ask for, because WhatsApp and the rest
		     squeeze the picture down to a thumbnail and a 1x one comes out soft. The ?v= is a
		     cache buster: they hold on to the old picture for weeks, so bump it on every change. -->
		<meta property="og:image" content="https://shivanigans.fyi/og-image.png?v=2" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="2400" />
		<meta property="og:image:height" content="1260" />
		<meta
			property="og:image:alt"
			content="Shivani's hand-drawn face with glasses on a yellow star, and the line: Shivani's corner on the internet"
		/>
		<meta name="twitter:card" content="summary_large_image" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "shivanigans",
				"url": "https://shivanigans.fyi/"
			}
		</script>

		%sveltekit.head%

		<!-- The fallback title and description, for pages that do not set their own.
		     They sit after %sveltekit.head% because a browser uses the FIRST title in the
		     page, so a page's own title has to come before this one. -->
		<title>shivanigans</title>
		<meta
			name="description"
			content="Shivani's corner on the internet"
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<script>
			// Swap the favicon to pink when the visitor leaves the tab
			const icons = document.querySelectorAll('link[rel="icon"][type="image/png"]');
			const yellow = [...icons].map((el) => el.href);
			const pink = yellow.map((href) => href.replace('favicon-', 'favicon-pink-'));

			document.addEventListener('visibilitychange', () => {
				const list = document.hidden ? pink : yellow;
				icons.forEach((el, i) => (el.href = list[i]));
			});
		</script>
	</body>
</html>
