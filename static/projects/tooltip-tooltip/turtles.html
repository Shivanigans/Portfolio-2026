<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip tooltip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ds-font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --stage: #f6f4f1;
    --ink-muted: #6f6862;
    --tip-bg: #1f1c1a;
    --tip-fg: #ffffff;
    --accent: #3b6cff;           /* used only for the focus ring */
    --gap: 6px;
    --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    --ease-out: cubic-bezier(.4, 0, 1, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--stage);
    font: 500 13px/1.2 var(--ds-font);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding-top: 200px;          /* headroom for a full stack of 5 */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* sentence */
  .line {
    margin: 0;
    color: #3a3531;
    font: 500 13px/1.2 var(--ds-font);
    letter-spacing: inherit;
  }

  /* host word */
  .host {
    position: relative;
    display: inline-block;
  }
  .word {
    color: var(--ink-muted);
    font-size: 13px;
    letter-spacing: inherit;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  /* tooltip bubble */
  .tip {
    --dx: 0px;                   /* horizontal offset from parent centre */
    position: absolute;
    left: 50%;
    bottom: calc(100% + var(--gap));
    translate: calc(-50% + var(--dx)) 0;
    transform-origin: calc(50% - var(--dx)) calc(100% + 5px);  /* the caret tip */

    padding: 7px 10px;
    border-radius: 6px;
    background: var(--tip-bg);
    color: var(--tip-fg);
    font: 500 13px/1.2 var(--ds-font);
    letter-spacing: inherit;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(20, 16, 14, .16), 0 1px 2px rgba(20, 16, 14, .22);
    touch-action: none;

    /* closed */
    opacity: 0;
    scale: .6;
    visibility: hidden;
    pointer-events: none;
    transition:
      opacity 130ms var(--ease-out),
      scale 140ms var(--ease-out),
      visibility 0s linear 140ms;
  }

  .tip.is-open {
    opacity: 1;
    scale: 1;
    visibility: visible;
    pointer-events: auto;
    transition:
      opacity 120ms ease-out,
      scale 240ms var(--ease-pop),
      visibility 0s;
  }

  /* root sits a touch higher so its caret clears the word */
  .host > .tip { bottom: calc(100% + 8px); }

  /* caret: 7px rotated square on the bottom edge, aimed at the parent centre */
  .tip::after {
    content: "";
    position: absolute;
    left: calc(50% - var(--dx));
    bottom: -3.5px;
    width: 7px;
    height: 7px;
    background: var(--tip-bg);
    border-radius: 1px;
    transform: translateX(-50%) rotate(45deg);
  }

  /* invisible bridge across the gap so the pointer doesn't "leave" between bubbles */
  .tip::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: calc(var(--gap) + 2px);
  }
  .host > .tip::before { height: 10px; }

  .label { position: relative; }

  /* accent only lives here */
  .word:focus { outline: none; }
  .word:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tip,
    .tip.is-open {
      scale: 1;
      transition: opacity 120ms linear, visibility 0s linear 120ms;
    }
    .tip.is-open { transition: opacity 120ms linear, visibility 0s; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <p class="line">It's turtles all the way down, starting with <span class="host" id="host"><span class="word">this</span></span>.</p>
  </main>

<script>
(() => {
  const MAX = 5;          // bubbles in a full stack
  const OFFSET = 10;      // zigzag offset, px (reduced from 18 to suit the narrower turtle-only bubble)
  const STAGGER = 75;     // collapse step, ms
  const HOLD_EVERY = 180; // add a bubble this often while held, ms

  const stage = document.getElementById('stage');
  const host = document.getElementById('host');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  // Build the nested DOM: each tip lives inside the previous one.
  const tips = [];
  let parent = host;
  for (let level = 1; level <= MAX; level++) {
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.dataset.level = level;
    const dx = level === 1 ? 0 : (level % 2 === 0 ? OFFSET : -OFFSET);
    tip.style.setProperty('--dx', dx + 'px');
    tip.innerHTML = '<span class="label">🐢</span>';
    tip.setAttribute('aria-hidden', 'true');
    parent.appendChild(tip);
    tips.push(tip);
    parent = tip;
  }

  // The word is now the first trigger; every turtle starts hidden.
  const word = host.querySelector('.word');
  word.tabIndex = 0;
  word.setAttribute('role', 'button');

  let timers = [];
  let holdTimer = null;

  const openCount = () => tips.filter(t => t.classList.contains('is-open')).length;

  function setOpen(tip, on) {
    tip.classList.toggle('is-open', on);
    tip.setAttribute('aria-hidden', String(!on));
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  // Open bubbles up to `to` (cancels any collapse in progress).
  function grow(to) {
    clearTimers();
    const target = Math.min(MAX, to);
    for (let i = openCount(); i < target; i++) setOpen(tips[i], true);
  }

  // Close from the top down, one step at a time.
  function collapse() {
    stopHold();
    clearTimers();
    const open = openCount();
    const step = reduceMotion.matches ? 0 : STAGGER;
    for (let i = open - 1, n = 0; i >= 0; i--, n++) {
      const tip = tips[i];
      timers.push(setTimeout(() => setOpen(tip, false), n * step));
    }
  }

  function startHold() {
    stopHold();
    grow(openCount() + 1);
    holdTimer = setInterval(() => {
      if (openCount() >= MAX) return stopHold();
      grow(openCount() + 1);
    }, HOLD_EVERY);
  }

  function stopHold() {
    clearInterval(holdTimer);
    holdTimer = null;
  }

  // Hover a visible tip: grow its own tooltip.
  stage.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const tip = e.target.closest('.tip.is-open');
    if (tip) grow(Number(tip.dataset.level) + 1);
    else if (e.target.closest('.word')) grow(1);   // hovering "this" shows the first turtle
  });

  // Press on the word or a tip: add one, keep adding while held.
  host.addEventListener('pointerdown', e => {
    const hit = e.target.closest('.tip.is-open') || e.target.closest('.word');
    if (!hit) return;
    e.preventDefault();
    startHold();
  });

  // Release keeps the stack.
  window.addEventListener('pointerup', stopHold);
  window.addEventListener('pointercancel', stopHold);

  // Leaving the word + stack collapses (mouse/pen only).
  host.addEventListener('pointerleave', e => {
    if (e.pointerType !== 'touch') collapse();
  });

  // Tap the empty stage collapses.
  stage.addEventListener('pointerdown', e => {
    if (!e.target.closest('.host')) collapse();
  });

  host.addEventListener('contextmenu', e => e.preventDefault());

  // Keyboard: Space/Enter holds, Escape or blur collapses.
  word.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) startHold();
    } else if (e.key === 'Escape') {
      collapse();
    }
  });
  word.addEventListener('keyup', e => {
    if (e.key === ' ' || e.key === 'Enter') stopHold();
  });
  word.addEventListener('blur', collapse);
})();
</script>
</body>
</html>
